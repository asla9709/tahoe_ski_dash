name: Update ski maps

# Refreshes open/closed status three times a day until ACTIVE_UNTIL, commits the updated status files and
# dist/ski-maps.html to main, and publishes the page to the gh-pages branch,
# which GitHub Pages serves at https://asla9709.github.io/tahoe_ski_dash/.

on:
  schedule:
    # 4am, 8am and 11pm Pacific Standard Time (12:00, 16:00 and 07:00 UTC).
    # Cron is in UTC, so during daylight time these run an hour later in Pacific time.
    - cron: "0 7,12,16 * * *"
  workflow_dispatch:

env:
  # Scheduled runs stop after this date (Pacific). The first scheduled run after it
  # disables this workflow. To extend: change the date, then re-enable the workflow
  # on the Actions tab if it was already disabled.
  ACTIVE_UNTIL: "2027-02-20"

permissions:
  contents: write

concurrency:
  group: update-ski-maps
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=America/Los_Angeles date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ ! "$today" > "$ACTIVE_UNTIL" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Past ACTIVE_UNTIL ($ACTIVE_UNTIL); disabling this workflow."
            gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Fetch status and rebuild page
        id: update
        # Exit code 1 = some resorts failed (their previous status is kept), 2 = all failed.
        run: |
          set +e
          npm run update
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "::warning::Some resorts could not be fetched; their previous status was kept."
          fi
          exit 0

      - name: Commit status to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status dist
          if git diff --cached --quiet; then
            echo "No status changes."
            exit 0
          fi
          git commit -m "Update ski map status"
          for i in 1 2 3 4; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push updated status."
          exit 1

      - name: Publish page to gh-pages
        run: |
          site=$(mktemp -d)
          cp dist/ski-maps.html "$site/index.html"
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ski maps"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Fail if no resort could be fetched
        if: steps.update.outputs.code == '2'
        run: |
          echo "::error::No resort status could be fetched. The resort sites may be blocking GitHub's runners."
          exit 1
